    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const inputText = document.getElementById('inputText');
            const templateText = document.getElementById('templateText');
            const outputText = document.getElementById('outputText');
            const convertBtn = document.getElementById('convertBtn');
            const downloadBtn = document.getElementById('downloadBtn');
            const copyBtn = document.getElementById('copyBtn');
            const clearBtn = document.getElementById('clearBtn');
            const mdFile = document.getElementById('mdFile');
            const statusMessage = document.getElementById('statusMessage');
            const loadingIndicator = document.getElementById('loadingIndicator');
            const inputStats = document.getElementById('inputStats');
            const outputStats = document.getElementById('outputStats');

            // Sezione dati di gioco (BGG + prezzo)
            const gameTitle = document.getElementById('gameTitle');
            const searchBggBtn = document.getElementById('searchBggBtn');
            const searchPriceBtn = document.getElementById('searchPriceBtn');
            const bggResults = document.getElementById('bggResults');
            const gameStatus = document.getElementById('gameStatus');
            const priceDetails = document.getElementById('priceDetails');
            const gameAutori = document.getElementById('gameAutori');
            const gameEditore = document.getElementById('gameEditore');
            const gameGiocatori = document.getElementById('gameGiocatori');
            const gameEta = document.getElementById('gameEta');
            const gameDurata = document.getElementById('gameDurata');
            const gameCosto = document.getElementById('gameCosto');

            // Aggiorna statistiche
            function updateStats(textarea, statsElement) {
                const text = textarea.value;
                const charCount = text.length;
                const lineCount = text ? text.split('\n').length : 0;
                statsElement.textContent = `Caratteri: ${charCount} | Righe: ${lineCount}`;
            }

            // Inizializza le statistiche all'avvio per eventuali campi precaricati
            updateStats(inputText, inputStats);
            updateStats(outputText, outputStats);

            inputText.addEventListener('input', () => updateStats(inputText, inputStats));
            outputText.addEventListener('input', () => updateStats(outputText, outputStats));

            // Gestione upload file
            mdFile.addEventListener('change', function(e) {
                const file = e.target.files[0];
                if (!file) return;

                const reader = new FileReader();
                reader.onload = function(e) {
                    inputText.value = e.target.result;
                    updateStats(inputText, inputStats);
                    statusMessage.textContent = `File "${file.name}" caricato con successo.`;
                    statusMessage.className = 'status success';
                };
                reader.onerror = function() {
                    statusMessage.textContent = 'Errore durante la lettura del file.';
                    statusMessage.className = 'status error';
                };
                reader.readAsText(file);
            });

            // ==========================================
            // DATI DI GIOCO: ricerca su BGG e prezzo
            // ==========================================

            async function fetchBggDetails(id) {
                gameStatus.textContent = 'Recupero dati del gioco da BGG...';
                gameStatus.className = 'status';
                try {
                    const resp = await fetch(`/api/bgg/game/${id}`);
                    const data = await resp.json();
                    if (!resp.ok) throw new Error(data.error || 'Errore BGG');

                    gameAutori.value = data.authors || '';
                    gameEditore.value = data.publisher || '';
                    gameGiocatori.value = data.players || '';
                    gameEta.value = data.age || '';
                    gameDurata.value = data.duration || '';
                    if (data.name) gameTitle.value = data.name;

                    gameStatus.textContent = `Dati di "${data.name}" caricati da BGG.`;
                    gameStatus.className = 'status success';
                } catch (err) {
                    gameStatus.textContent = 'Errore nel recupero dati da BGG: ' + err.message;
                    gameStatus.className = 'status error';
                }
            }

            searchBggBtn.addEventListener('click', async function() {
                const query = gameTitle.value.trim();
                if (!query) {
                    gameStatus.textContent = 'Inserisci il titolo del gioco.';
                    gameStatus.className = 'status error';
                    return;
                }

                bggResults.style.display = 'none';
                bggResults.innerHTML = '';
                gameStatus.textContent = 'Ricerca su BGG in corso...';
                gameStatus.className = 'status';

                try {
                    const resp = await fetch(`/api/bgg/search?q=${encodeURIComponent(query)}`);
                    const data = await resp.json();
                    if (!resp.ok) throw new Error(data.error || 'Errore BGG');

                    if (!data.length) {
                        gameStatus.textContent = 'Nessun risultato trovato su BGG.';
                        gameStatus.className = 'status error';
                        return;
                    }

                    if (data.length === 1) {
                        await fetchBggDetails(data[0].id);
                        return;
                    }

                    const placeholder = document.createElement('option');
                    placeholder.value = '';
                    placeholder.textContent = '-- Seleziona il gioco corretto --';
                    placeholder.disabled = true;
                    placeholder.selected = true;
                    bggResults.appendChild(placeholder);

                    for (const item of data) {
                        const opt = document.createElement('option');
                        opt.value = item.id;
                        opt.textContent = item.year ? `${item.name} (${item.year})` : item.name;
                        bggResults.appendChild(opt);
                    }
                    bggResults.style.display = 'block';
                    gameStatus.textContent = `Trovati ${data.length} risultati: scegli quello giusto dall'elenco.`;
                    gameStatus.className = 'status';
                } catch (err) {
                    gameStatus.textContent = 'Errore nella ricerca su BGG: ' + err.message;
                    gameStatus.className = 'status error';
                }
            });

            bggResults.addEventListener('change', function() {
                if (bggResults.value) fetchBggDetails(bggResults.value);
            });

            searchPriceBtn.addEventListener('click', async function() {
                const query = gameTitle.value.trim();
                if (!query) {
                    gameStatus.textContent = 'Inserisci il titolo del gioco.';
                    gameStatus.className = 'status error';
                    return;
                }

                priceDetails.textContent = '';
                gameStatus.textContent = 'Ricerca prezzo in corso sui negozi online...';
                gameStatus.className = 'status';

                try {
                    const resp = await fetch(`/api/price?title=${encodeURIComponent(query)}`);
                    const data = await resp.json();
                    if (!resp.ok) throw new Error(data.error || 'Errore ricerca prezzo');

                    if (!data.details.length) {
                        gameStatus.textContent = 'Nessun prezzo trovato nei negozi configurati. Inserisci il costo manualmente.';
                        gameStatus.className = 'status error';
                        return;
                    }

                    gameCosto.value = data.label;
                    priceDetails.innerHTML = data.details
                        .map(d => `<span>${d.store}: ${d.price.toFixed(2)}€</span>`)
                        .join('');
                    gameStatus.textContent = `Prezzo medio calcolato su ${data.details.length} negozio/i, arrotondato ai 5€.`;
                    gameStatus.className = 'status success';
                } catch (err) {
                    gameStatus.textContent = 'Errore nella ricerca del prezzo: ' + err.message;
                    gameStatus.className = 'status error';
                }
            });

            // ==========================================
            // LOGICA DI CONVERSIONE (Porting da MATLAB)
            // ==========================================

            function isCustomMarker(line) {
                const tags = ['[intro]','[/intro]','[cap]','[/cap]','[corpo]','[/corpo]','[finale]','[/finale]'];
                return tags.includes(line);
            }

            function applyFormatting(text) {
                let formatted = text;
                const LINK_START = '', LINK_MID = '', LINK_END = '';
                const BOLD_START = '', BOLD_END = '';
                const ITALIC_START = '', ITALIC_END = '';
                const EM_START = '', EM_END = '';

                // 1. Link
                formatted = formatted.replace(/\[([^\]]+)\]\((https?:\/\/[^\)]+)\)/g, LINK_START + '$2' + LINK_MID + '$1' + LINK_END);
                // 2. Bold
                formatted = formatted.replace(/\*(.*?)\*/g, BOLD_START + '$1' + BOLD_END);
                // 3. Italic
                formatted = formatted.replace(/_(.*?)_/g, ITALIC_START + '$1' + ITALIC_END);
                // 4. Enfasi §§
                formatted = formatted.replace(/§§(.*?)§§/g, EM_START + '$1' + EM_END);

                // 5. Escape HTML
                formatted = formatted.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

                // 6. Sostituisci placeholder
                formatted = formatted.split(LINK_START).join('<a href="');
                formatted = formatted.split(LINK_MID).join('" target="_blank" rel="noopener noreferrer">');
                formatted = formatted.split(LINK_END).join('</a>');
                formatted = formatted.split(BOLD_START).join('<strong>');
                formatted = formatted.split(BOLD_END).join('</strong>');
                formatted = formatted.split(ITALIC_START).join('<i>');
                formatted = formatted.split(ITALIC_END).join('</i>');
                formatted = formatted.split(EM_START).join('<em>');
                formatted = formatted.split(EM_END).join('</em>');

                return formatted;
            }

            function escapeHTML(text) {
                return text.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
            }

            function convertMarkdownToHTML(rawText) {
                // Normalizza newline
                let text = rawText.replace(/\r\n/g, '\n').replace(/\r/g, '\n');
                let lines = text.split('\n');
                let htmlLines = [];
                let inParagraph = false;
                let inList = false;

                for (let i = 0; i < lines.length; i++) {
                    let trimmed = lines[i].trim();
                    if (!trimmed) {
                        lines[i] = '';
                        trimmed = '';
                    }

                    // Marker custom
                    if (isCustomMarker(trimmed)) {
                        if (inParagraph) {
                            htmlLines[htmlLines.length - 1] += "</p>";
                            inParagraph = false;
                        }
                        if (inList) {
                            htmlLines.push("</ul>");
                            inList = false;
                        }
                        htmlLines.push(trimmed);
                        continue;
                    }

                    // Riga vuota
                    if (!trimmed) {
                        if (inParagraph) {
                            htmlLines[htmlLines.length - 1] += "</p>";
                            inParagraph = false;
                        }
                        if (inList) {
                            htmlLines.push("</ul>");
                            inList = false;
                        }
                        continue;
                    }

                    // Titoli
                    let isHeader = false;
                    for (let lvl = 4; lvl >= 1; lvl--) {
                        let h = '#'.repeat(lvl);
                        let regex = new RegExp('^' + h + '\\s+(.*?)\\s*#*\\s*$');
                        let match = trimmed.match(regex);
                        if (match) {
                            if (inParagraph) {
                                htmlLines[htmlLines.length - 1] += "</p>";
                                inParagraph = false;
                            }
                            if (inList) {
                                htmlLines.push("</ul>");
                                inList = false;
                            }
                            let headerText = match[1].trim();
                            htmlLines.push(`<h${lvl}>${escapeHTML(headerText)}</h${lvl}>`);
                            isHeader = true;
                            break;
                        }
                    }
                    if (isHeader) continue;

                    // Liste (+ )
                    if (trimmed.startsWith('+ ')) {
                        if (inParagraph) {
                            htmlLines[htmlLines.length - 1] += "</p>";
                            inParagraph = false;
                        }
                        if (!inList) {
                            htmlLines.push("<ul>");
                            inList = true;
                        }
                        htmlLines.push("<li>" + applyFormatting(trimmed.substring(2)) + "</li>");
                        continue;
                    }

                    // Paragrafi
                    if (!inParagraph) {
                        htmlLines.push("<p>" + applyFormatting(trimmed));
                        inParagraph = true;
                    } else {
                        htmlLines[htmlLines.length - 1] += "<br>" + applyFormatting(trimmed);
                    }
                }

                if (inParagraph) htmlLines[htmlLines.length - 1] += "</p>";
                if (inList) htmlLines.push("</ul>");

                return htmlLines.join('\n');
            }

            function extractSection(content, tag) {
                let endTag = '[/' + tag.substring(1);
                let s = content.indexOf(tag);
                let e = content.indexOf(endTag);
                if (s === -1 || e === -1) return "";
                return content.substring(s + tag.length, e).trim();
            }

            function convertToGutenberg(htmlBlock) {
                let lines = htmlBlock.split('\n');
                let out = [];
                for (let i = 0; i < lines.length; i++) {
                    let line = lines[i].trim();
                    if (!line) continue;

                    // Heading
                    let hMatch = line.match(/^<h(\d)>(.*)<\/h\d>$/);
                    if (hMatch) {
                        let lvl = hMatch[1];
                        let txt = hMatch[2];
                        out.push(`<!-- wp:heading {"level":${lvl}} -->\n<h${lvl} class="wp-block-heading">${txt}</h${lvl}>\n<!-- /wp:heading -->`);
                        continue;
                    }

                    // Paragraph
                    let pMatch = line.match(/^<p>(.*)<\/p>$/);
                    if (pMatch) {
                        let txt = pMatch[1];
                        out.push(`<!-- wp:paragraph -->\n<p>${txt}</p>\n<!-- /wp:paragraph -->`);
                        continue;
                    }

                    // Fallback per Liste e altro
                    out.push(line);
                }
                return out.join('\n\n');
            }

            // Azione del Converti
            convertBtn.addEventListener('click', function() {
                const mdText = inputText.value;
                const tplText = templateText.value;

                if (!mdText.trim()) {
                    statusMessage.textContent = 'Inserisci il testo Markdown da convertire.';
                    statusMessage.className = 'status error';
                    return;
                }

                loadingIndicator.style.display = 'block';
                statusMessage.textContent = '';

                setTimeout(() => {
                    try {
                        // 1. Markdown -> HTML
                        let htmlIntermedio = convertMarkdownToHTML(mdText);

                        // 2. HTML -> WordPress
                        let sectionTags = ['intro', 'cap', 'corpo', 'finale'];
                        let sections = {};
                        for (let tag of sectionTags) {
                            let raw = extractSection(htmlIntermedio, '[' + tag + ']');
                            sections[tag] = convertToGutenberg(raw);
                        }

                        // 3. Sostituzione nel Template
                        let finalWp = tplText;
                        for (let tag of sectionTags) {
                            finalWp = finalWp.replace('[' + tag + ']', sections[tag] !== undefined ? sections[tag] : '');
                        }

                        // 3bis. Sostituzione dei dati di gioco (BGG + prezzo)
                        let gameFields = {
                            autori: gameAutori.value,
                            editore: gameEditore.value,
                            giocatori: gameGiocatori.value,
                            eta: gameEta.value,
                            durata: gameDurata.value,
                            costo: gameCosto.value
                        };
                        for (let tag in gameFields) {
                            finalWp = finalWp.replace('[' + tag + ']', gameFields[tag] || '');
                        }

                        // Pulizia newline
                        finalWp = finalWp.replace(/\r\n/g, '\n').replace(/\r/g, '\n');

                        outputText.value = finalWp;
                        updateStats(outputText, outputStats);

                        downloadBtn.disabled = false;
                        copyBtn.disabled = false;

                        statusMessage.textContent = 'Conversione completata con successo!';
                        statusMessage.className = 'status success';
                    } catch (error) {
                        statusMessage.textContent = 'Errore durante la conversione: ' + error.message;
                        statusMessage.className = 'status error';
                    } finally {
                        loadingIndicator.style.display = 'none';
                    }
                }, 100);
            });

            // Download TXT
            downloadBtn.addEventListener('click', function() {
                const wpCode = outputText.value;
                if (!wpCode.trim()) return;

                const blob = new Blob([wpCode], { type: 'text/plain;charset=utf-8' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'output_wp.txt';
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);

                statusMessage.textContent = 'File scaricato con successo!';
                statusMessage.className = 'status success';
            });

            // Copia negli appunti
            copyBtn.addEventListener('click', function() {
                outputText.select();
                document.execCommand('copy');

                const originalText = copyBtn.textContent;
                copyBtn.textContent = 'Copiato!';
                setTimeout(() => { copyBtn.textContent = originalText; }, 2000);

                statusMessage.textContent = 'Codice copiato negli appunti!';
                statusMessage.className = 'status success';
            });

            // Pulisci
            clearBtn.addEventListener('click', function() {
                inputText.value = '';
                outputText.value = '';
                mdFile.value = '';
                downloadBtn.disabled = true;
                copyBtn.disabled = true;
                statusMessage.textContent = '';
                updateStats(inputText, inputStats);
                updateStats(outputText, outputStats);
            });
        });
    </script>
</body>
</html>
